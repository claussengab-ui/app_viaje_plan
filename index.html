<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro viaje</title>
<meta name="theme-color" content="#16324F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --papel:#F3F6F9; --superficie:#FFFFFF; --texto:#1A2632; --suave:#5A6B7C; --linea:#D9E1E9;
  --cab:#16324F; --cab-t:#F3F6F9; --ruta:#E2A60E; --mar:#1F7A99; --alerta:#B5391F; --ok:#2A8253;
  --fondo-alerta:#FBEDE8; --fondo-ok:#E7F4EC; --fondo-mar:#E3F1F6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#0D1824; --superficie:#152536; --texto:#E3EBF2; --suave:#97A8B9; --linea:#26394D;
    --cab:#0A2238; --cab-t:#E3EBF2; --ruta:#F0BE3A; --mar:#5AB3D2; --alerta:#F27D64; --ok:#5DC28A;
    --fondo-alerta:#3A1E18; --fondo-ok:#163324; --fondo-mar:#13303D;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--papel);color:var(--texto);font:16px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:var(--mar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ruta);outline-offset:2px}

/* Estructura */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.menu{position:sticky;top:0;height:100vh;background:var(--cab);color:var(--cab-t);padding:22px 12px;display:flex;flex-direction:column;gap:2px;z-index:1100}
.menu .marca{font:800 1.25rem/1.1 'Bricolage Grotesque',system-ui,sans-serif;padding:4px 12px 20px}
.menu .marca small{display:block;font:400 .85rem 'Atkinson Hyperlegible',sans-serif;opacity:.7;margin-top:4px}
.menu button{background:none;border:0;cursor:pointer;padding:9px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;text-align:left;color:inherit}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button[aria-current="page"]{background:rgba(255,255,255,.15);font-weight:700}
.menu .yo{margin-top:auto;font-size:.85rem;opacity:.75;padding:8px 12px}
main{padding:32px clamp(16px,4vw,48px) 96px;width:100%;max-width:980px}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  .menu{height:auto;flex-direction:row;overflow-x:auto;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:4px;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu .marca,.menu .yo{display:none}
  .menu button{white-space:nowrap;padding:8px 12px;flex:none}
  main{padding-top:20px}
}

/* Encabezados de sección */
.titulo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.titulo h2{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800}
.titulo p{margin:6px 0 0;color:var(--suave)}
h3.grupo{font-size:1.15rem;margin:26px 0 10px;font-weight:600}

/* Botones */
.btn{border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--cab);color:var(--cab-t)}
@media (prefers-color-scheme: dark){.btn.pri{background:var(--ruta);color:#1A1405}}
.btn.sec{background:transparent;border:1.5px solid var(--linea)}
.btn.peligro{background:transparent;color:var(--alerta);border:1.5px solid currentColor}
.btn.chico{padding:6px 12px;font-size:.9rem}

/* Boleto (inicio) */
.boleto{display:grid;grid-template-columns:1fr auto;background:var(--cab);color:var(--cab-t);border-radius:20px;margin-bottom:28px;position:relative}
.boleto .izq{padding:26px 28px}
.boleto h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:800}
.boleto .izq p{margin:10px 0 0;opacity:.8}
.boleto .der{padding:22px 28px;border-left:2px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;justify-content:center;text-align:center;min-width:160px;position:relative}
.boleto .der::before,.boleto .der::after{content:"";position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--papel)}
.boleto .der::before{top:-12px}.boleto .der::after{bottom:-12px}
.boleto .cifra{font:800 3.4rem/1 'Bricolage Grotesque',sans-serif;color:var(--ruta)}
.boleto .der span{opacity:.85;margin-top:6px}
@media (max-width:560px){
  .boleto{grid-template-columns:1fr}
  .boleto .der{border-left:0;border-top:2px dashed rgba(255,255,255,.3);flex-direction:row;gap:12px;align-items:baseline;justify-content:flex-start;text-align:left}
  .boleto .der::before,.boleto .der::after{top:-13px;left:auto}
  .boleto .der::before{left:-12px}.boleto .der::after{right:-12px;bottom:auto}
  .boleto .cifra{font-size:2.6rem}
}

/* Cifras del resumen */
.cifras{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 26px;padding:0;list-style:none}
.cifras li{color:var(--suave)}
.cifras b{color:var(--texto);font:800 1.4rem 'Bricolage Grotesque',sans-serif;margin-right:4px}

/* Avisos */
.avisos{display:grid;gap:8px;margin-bottom:30px}
.aviso{padding:12px 16px;border-radius:12px;background:var(--fondo-alerta);border-left:5px solid var(--alerta)}
.aviso.ok{background:var(--fondo-ok);border-color:var(--ok)}
.aviso.info{background:var(--fondo-mar);border-color:var(--mar)}

/* Línea del recorrido (estilo metro) */
.metro{list-style:none;margin:0;padding:0;position:relative}
.metro::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--ruta)}
.estacion{position:relative;display:grid;grid-template-columns:44px 1fr;gap:16px;padding:12px 0;cursor:pointer}
.punto{width:44px;height:44px;border-radius:50%;background:var(--superficie);border:6px solid var(--ruta);display:grid;place-items:center;font:800 1rem 'Bricolage Grotesque',sans-serif;position:relative;z-index:1}
.estacion h3{font-size:1.45rem;font-weight:800}
.estacion .fechas{color:var(--suave);margin:2px 0 6px}
.estacion .aloj{font-size:.95rem}
.tramo{position:relative;padding:2px 0 2px 60px;color:var(--suave);font-size:.93rem;cursor:pointer}
.tramo b{color:var(--texto);font-weight:700}
.noches{display:inline-block;background:var(--fondo-mar);color:var(--mar);border-radius:999px;padding:1px 10px;font-weight:700;font-size:.85rem;margin-left:6px;vertical-align:middle}

/* Tarjetas */
.lista{display:grid;gap:10px}
.tarjeta{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;cursor:pointer;display:grid;gap:4px}
.tarjeta:hover{border-color:var(--suave)}
.tarjeta .fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tarjeta h4{margin:0;font-size:1.08rem}
.tarjeta .meta{color:var(--suave);font-size:.93rem}
.tarjeta .meta span+span::before{content:"  /  ";opacity:.5;white-space:pre}
.tarjeta .nota{font-size:.92rem;color:var(--suave);white-space:pre-wrap}
.tarjeta.apagada{opacity:.55}
.tarjeta.apagada h4{text-decoration:line-through}
.monto{font-weight:700;white-space:nowrap}
.estado{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--papel);color:var(--suave);white-space:nowrap}
.estado.Reservado{background:var(--fondo-mar);color:var(--mar)}
.estado.Pagado{background:var(--fondo-ok);color:var(--ok)}
.estado.Porreservar{background:var(--fondo-alerta);color:var(--alerta)}
.autor{font-size:.8rem;color:var(--suave)}
.vacio{border:2px dashed var(--linea);border-radius:14px;padding:28px;text-align:center;color:var(--suave)}
.vacio .btn{margin-top:12px}

/* Ideas y checklist */
.acciones-tarjeta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pastilla{border:1.5px solid var(--linea);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.9rem}
.pastilla[aria-pressed="true"]{background:var(--fondo-mar);border-color:var(--mar);color:var(--mar);font-weight:700}
.tarea{display:flex;align-items:center;gap:12px;background:var(--superficie);border:1px solid var(--linea);border-radius:12px;padding:10px 14px}
.tarea .txt{flex:1;cursor:pointer}
.tarea .txt small{display:block;color:var(--suave)}
.tarea.hecha .txt{text-decoration:line-through;color:var(--suave)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--suave);background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rapido{display:flex;gap:8px;margin-bottom:16px}
.rapido input{flex:1}

/* Gastos */
.balance{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:16px 18px;margin-bottom:20px}
.balance h3{font-size:1.1rem;margin-bottom:8px}
.balance p{margin:4px 0}

/* Mapa */
main.ancho{max-width:none}
.mapa-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
#mapa,.panel-mapa{height:calc(100vh - 220px);min-height:420px}
#mapa{border-radius:16px;border:1px solid var(--linea);z-index:0}
.panel-mapa{overflow:auto;background:var(--superficie);border:1px solid var(--linea);border-radius:16px;padding:14px}
.panel-mapa .btn.ancho{width:100%;justify-content:center}
.panel-mapa .autor{margin:8px 0 6px}
.panel-mapa .estacion h3{font-size:1.15rem}
.panel-mapa [data-foco]{border-radius:12px;transition:background .2s}
.panel-mapa [data-foco]:hover{background:var(--papel)}
.panel-mapa [data-foco].activo{background:var(--fondo-mar)}
@media (max-width:1000px){
  .mapa-wrap{grid-template-columns:1fr}
  #mapa{height:62vh;min-height:340px}
  .panel-mapa{height:auto;min-height:0}
}
.num-mapa{background:var(--ruta);color:#1A1405;border:3px solid #fff;border-radius:50%;width:30px!important;height:30px!important;display:grid;place-items:center;font:800 14px 'Bricolage Grotesque',sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.icono-medio{background:#fff;border-radius:50%;display:grid!important;place-items:center;font-size:16px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.leaflet-tooltip.etiqueta{background:rgba(255,255,255,.92);border:0;box-shadow:0 1px 3px rgba(0,0,0,.25);font:700 13px 'Bricolage Grotesque',sans-serif;color:#16324F;padding:2px 8px}
.leaflet-tooltip.etiqueta.suave{font-weight:600;color:#5A6B7C}
.leaflet-tooltip.etiqueta::before{display:none}
.enlace{font-weight:700;text-decoration:none;white-space:nowrap}
.enlace:hover{text-decoration:underline}
.tramo-cab{color:var(--texto)}
.leyenda{display:flex;gap:10px 20px;flex-wrap:wrap;margin-top:12px;color:var(--suave);font-size:.9rem;align-items:center}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:50%}
.mini-num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ruta);color:#1A1405;font:800 11px 'Bricolage Grotesque',sans-serif}

/* Recorrido como cadena de destinos */
.cadena{position:relative;display:grid;gap:0}
.cadena::before{content:"";position:absolute;left:27px;top:14px;bottom:14px;width:4px;border-radius:2px;background:repeating-linear-gradient(var(--ruta) 0 10px,transparent 10px 16px)}
.extremo{position:relative;padding:6px 0 6px 14px;font-weight:700;color:var(--suave);background:var(--papel);width:max-content;border-radius:999px}
.destino-card{position:relative;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--superficie);border:2px solid var(--linea);border-radius:18px;padding:16px 18px 16px 0;cursor:pointer;margin:6px 0}
.destino-card:hover{border-color:var(--ruta)}
.destino-card .num,.num.grande{width:44px;height:44px;margin-left:6px;border-radius:50%;background:var(--ruta);color:#1A1405;display:grid;place-items:center;font:800 1.2rem 'Bricolage Grotesque',sans-serif;box-shadow:0 0 0 5px var(--superficie)}
.destino-card h3{font-size:1.5rem;font-weight:800}
.destino-card p{margin:2px 0 8px;color:var(--suave)}
.destino-card .flecha{font-size:2rem;color:var(--suave);padding-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .noches{margin:0}
.chip{font-size:.85rem;border-radius:999px;padding:2px 10px;background:var(--papel);color:var(--suave);font-weight:700}
.chip.ok{background:var(--fondo-ok);color:var(--ok)}
.chip.alerta{background:var(--fondo-alerta);color:var(--alerta)}
.conector{position:relative;display:grid;gap:8px;padding:10px 0 10px 64px}
.conector.sin{display:flex;gap:12px;align-items:center;padding-left:14px;color:var(--suave)}
.conector.sin .burbuja{background:var(--papel);border:2px dashed var(--suave);color:var(--suave);width:30px;height:30px;font-size:1rem}
.conector.sin .btn{margin-top:6px}
.dest-col .conector{padding-left:0}
.dest-col .conector.sin{padding-left:0}
.tramo-card{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--superficie);border:1px solid var(--linea);border-left:5px solid var(--c);border-radius:14px;padding:12px 14px;cursor:pointer}
.tramo-card:hover{border-color:var(--c)}
.burbuja{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:var(--papel);flex:none}
.tc{display:grid;gap:8px;min-width:0}
.tc-serv{color:var(--suave)}
.tc-horas{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.tc-horas>div{display:grid}
.tc-horas .der{text-align:right}
.tc-horas strong{font:800 1.6rem/1.1 'Bricolage Grotesque',sans-serif}
.tc-horas small{color:var(--suave);font-size:.82rem}
.tc-linea{position:relative;height:20px;text-align:center}
.tc-linea::before{content:"";position:absolute;left:0;right:8px;top:50%;border-top:2px dashed var(--c)}
.tc-linea::after{content:"";position:absolute;right:0;top:calc(50% - 5px);border-left:9px solid var(--c);border-top:5px solid transparent;border-bottom:5px solid transparent}
.tc-linea span{position:relative;background:var(--superficie);padding:0 8px;font-size:.82rem;font-weight:700;color:var(--suave)}
.escala{font-size:.9rem;color:var(--suave);padding:2px 0 2px 14px;border-left:3px dotted var(--linea);margin-left:18px}
.escala.justa{color:var(--alerta);font-weight:700}

/* Horario del alojamiento */
.horario-aloj{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:6px 0 2px}
.horario-aloj>div{display:grid}
.horario-aloj .der{text-align:right}
.horario-aloj strong{font:800 1.4rem/1.1 'Bricolage Grotesque',sans-serif}
.horario-aloj small{color:var(--suave);font-size:.82rem}

/* Página de un destino */
.dest-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.dest-nav .sep{flex:1}
.dest-hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start;background:var(--cab);color:var(--cab-t);border-radius:20px;padding:24px}
.dest-hero .num.grande{width:60px;height:60px;font-size:1.7rem;margin:0;box-shadow:none}
.dest-hero h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800}
.dest-hero p{margin:4px 0 0;opacity:.85}
.dest-hero .enlace{color:var(--ruta)}
.dest-hero .btn.sec{border-color:rgba(255,255,255,.35);color:var(--cab-t)}
@media (max-width:560px){.dest-hero{grid-template-columns:auto 1fr}.dest-hero>.btn{grid-column:1/-1;justify-self:start}}
.nota-destino{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--superficie);border:1px solid var(--linea);white-space:pre-wrap}
.dest-grid{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.dest-mapa{position:sticky;top:20px;margin-top:26px}
#mapaDestino{height:420px;border-radius:16px;border:1px solid var(--linea);z-index:0}
@media (max-width:1000px){.dest-grid{grid-template-columns:1fr}.dest-mapa{position:static;order:-1}#mapaDestino{height:300px}}
.sub-titulo{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sub-titulo .btn{margin-bottom:10px}
h4.cat{margin:14px 0 8px;font-size:1rem;color:var(--suave)}
.vacio.chico{padding:16px}
.enlace-titulo{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.enlace-titulo:hover{color:var(--mar)}
.ver-dest{margin-top:8px}
.icono-medio.hecho{opacity:.5}
.panel-mapa .estacion{padding-right:6px}

/* Calendario */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1000px){.cal-wrap{grid-template-columns:1fr}}
.mes h3{text-transform:capitalize;margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-sem{font-size:.8rem;color:var(--suave);text-align:center;padding-bottom:2px}
.cal-dia{position:relative;min-height:84px;border:1.5px solid var(--linea);border-radius:12px;background:var(--superficie);padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left;overflow:hidden}
.cal-dia[style]{background:color-mix(in srgb,var(--c) 20%,var(--superficie));border-color:color-mix(in srgb,var(--c) 45%,var(--linea))}
.cal-dia.fuera{opacity:.45}
.cal-dia.sel{outline:3px solid var(--texto);outline-offset:1px}
.cal-dia.hoy .cd-num{background:var(--texto);color:var(--papel);border-radius:999px;padding:0 6px}
.cd-num{font:800 1rem 'Bricolage Grotesque',sans-serif}
.cd-ciudad{font-size:.72rem;font-weight:700;line-height:1.1;color:var(--texto);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-ico{margin-top:auto;font-size:.85rem;display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.cd-pan{font-size:.75rem;font-weight:700}
@media (max-width:560px){.cal-dia{min-height:62px;padding:4px;border-radius:9px}.cd-ciudad{font-size:.62rem}.cd-ico{font-size:.7rem}}
.cal-leyenda{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.chip-dest{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--linea);background:var(--superficie);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700}
.chip-dest i{width:12px;height:12px;border-radius:50%;background:var(--c)}

/* Detalle de un día */
.dia-detalle{background:var(--superficie);border:1px solid var(--linea);border-top:6px solid var(--c);border-radius:18px;padding:18px 20px}
.dia-cab{display:grid;gap:10px}
.dia-cab p{margin:0;color:var(--suave)}
.dia-cab h2{font-size:1.7rem;font-weight:800;text-transform:capitalize;margin:2px 0 4px}
.destino-dia{font-weight:800;font-size:1.1rem;color:var(--texto)}
.dia-extra,.dh-extra{display:grid;gap:4px;font-size:.93rem;color:var(--suave)}
.dh-extra{color:inherit;opacity:.9;margin-top:8px}
.dia-detalle h3.grupo{margin-top:20px}
.aloj-dia{cursor:pointer}
.enlaces{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.pendientes{margin-top:16px}
.pendientes summary{cursor:pointer;font-weight:700;color:var(--mar)}
.pendientes .plan-dia{margin-top:8px}

/* Plan día a día */
.plan{display:grid;gap:10px}
.plan-dia{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.dia-detalle .plan-dia{background:var(--papel)}
.pd-cab{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.pd-cab b{text-transform:capitalize}
.pd-acc{display:flex;gap:14px}
.pd-acc .enlace-titulo{color:var(--mar);font-weight:700;font-size:.9rem}
.fila-pan{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--linea)}
.fila-pan:first-of-type{border-top:0}
.pd-cab+.fila-pan{border-top:1px solid var(--linea)}
.fila-pan.hecha .fp-txt b{text-decoration:line-through;opacity:.6}
.fp-ico{font-size:1.2rem}
.fp-txt{flex:1;min-width:140px;cursor:pointer;display:grid}
.fp-txt small{color:var(--suave)}
.fp-acc{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.mini{width:auto;padding:5px 8px;font-size:.88rem;border-radius:8px}
.chips-dia{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips-dia .pastilla{text-transform:capitalize}
.barra{height:12px;border-radius:999px;background:var(--papel);overflow:hidden;margin-bottom:8px}
.barra span{display:block;height:100%;border-radius:999px}

/* Hoy */
.proximo{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--cab);color:var(--cab-t);border-radius:18px;padding:16px 18px;margin-bottom:14px;cursor:pointer}
.proximo .burbuja{background:rgba(255,255,255,.12)}
.proximo div{display:grid}
.proximo small{opacity:.75}
.proximo b{font:800 1.2rem 'Bricolage Grotesque',sans-serif}
.cuenta-prox{text-align:right}
.cuenta-prox strong{font:800 1.7rem/1 'Bricolage Grotesque',sans-serif;color:var(--ruta)}
.nav-dia{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0}
.nav-dia .btn:disabled{opacity:.4;cursor:default}
.nav-dia span{color:var(--suave);font-weight:700}

/* Formularios */
input,select,textarea{width:100%;background:var(--papel);border:1.5px solid var(--linea);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--mar);outline:none}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--superficie);color:var(--texto);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.form{padding:22px 22px 18px}
.form h2{font-size:1.5rem;margin-bottom:16px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:grid;gap:4px;font-size:.92rem}
.campo>span{font-weight:700}
.campo.ancho{grid-column:1/-1}
@media (max-width:480px){.campos{grid-template-columns:1fr}}
.geo{display:flex;gap:6px}
.geo .btn{flex:none}
.geo-res{margin:2px 0 0;color:var(--suave);font-size:.85rem}
.acciones{display:flex;gap:8px;margin-top:20px;align-items:center;flex-wrap:wrap}
.acciones .sep{flex:1}

/* Pantallas de entrada */
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cab);color:var(--cab-t)}
.entrada .caja{width:min(400px,100%)}
.entrada h1{font-size:2.6rem;font-weight:800;margin-bottom:10px}
.entrada p{opacity:.85}
.entrada input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:var(--cab-t);margin:16px 0 12px;font-size:1.1rem}
.entrada .btn{background:var(--ruta);color:#1A1405;width:100%;justify-content:center;padding:12px}
.entrada .err{color:#FFB4A4;min-height:1.5em;margin:8px 0 0}
.entrada .opciones{display:grid;gap:8px;margin-top:16px}
.entrada .opciones .btn{background:rgba(255,255,255,.12);color:var(--cab-t)}
.entrada code{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:5px}

/* Aviso flotante */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--texto);color:var(--papel);padding:10px 18px;border-radius:999px;z-index:3000;font-weight:700;max-width:90vw;text-align:center}
.toast.error{background:var(--alerta);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:sube .25s ease-out}
  @keyframes sube{from{opacity:0;transform:translate(-50%,10px)}}
}

/* =========================================================
   Supabase
   ========================================================= */
const CFG = window.CONFIG || {};
const configurado = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes('TU-PROYECTO') && CFG.SUPABASE_KEY && !CFG.SUPABASE_KEY.includes('PEGA-AQUI');

function crearCliente(clave) {
  return supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {
    global: { headers: { 'x-clave-viaje': clave } },
    auth: { persistSession: false, autoRefreshToken: false },

}

async function probarClave(clave) {
  const c = crearCliente(clave);
  const { data, error } = await c.rpc('clave_ok');
  if (error) throw error;
  return data === true ? c : null;
}

let recargaPendiente = null;
function recargarPronto() { clearTimeout(recargaPendiente); recargaPendiente = setTimeout(cargar, 300); }

async function cargar() {
  const { data, error } = await sb.from('items').select('*').order('creado');
  if (error) { toast('No se pudieron cargar los datos: ' + error.message, true); return; }
  st.items = data || [];
  render();
}

function escucharCambios() {
  canal = sb.channel('viaje-cambios', { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'cambio' }, recargarPronto)
    .subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) recargarPronto(); });
  setInterval(() => { if (!document.hidden) cargar(); }, 60000);
}
const avisarCambio = () => { try { canal?.send({ type: 'broadcast', event: 'cambio', payload: {} }); } catch {} };

async function guardar(tipo, datos, id) {
  const q = id
    ? sb.from('items').update({ datos, actualizado: new Date().toISOString() }).eq('id', id)
    : sb.from('items').insert({ tipo, datos, autor: st.yo || null });
  const { error } = await q;
  if (error) {
    toast(/row-level security/i.test(error.message) ? 'La clave del viaje cambió. Vuelve a ingresarla en Ajustes.' : 'No se pudo guardar: ' + error.message, true);
    return false;
  }
  await cargar(); avisarCambio(); return true;
}

async function guardarVarios(filas) {
  const { error } = await sb.from('items').insert(filas.map(f => ({ ...f, autor: st.yo || null })));
  if (error) { toast('No se pudo guardar: ' + error.message, true); return; }
  await cargar(); avisarCambio();
}

async function borrar(id) {
  const { error } = await sb.from('items').delete().eq('id', id);
  if (error) { toast('No se pudo eliminar: ' + error.message, true); return false; }
  await cargar(); avisarCambio(); return true;
}

async function geocodificar(q) {
  if (!q) return null;
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=es&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j[0]) return null;
    const lat = +j[0].lat, lng = +j[0].lon;
    return { lat, lng, nombre: j[0].display_name.split(',').slice(0, 3).join(',').trim(), tz: zonaDe(j[0].address?.country_code, lat, lng) };

function zonaDe(cc, lat, lng) {
  cc = (cc || '').toLowerCase();
  if (cc === 'us') return lng < -150 ? 'Pacific/Honolulu' : lng > -87 ? 'America/New_York' : lng > -101 ? 'America/Chicago' : lng > -115 ? 'America/Denver' : 'America/Los_Angeles';

  } catch { return ''; }

const tzPedidos = new Set();
async function asegurarZona(e) {
  const u = e?.datos.ubicacion;
  if (!u?.lat || u.tz || tzPedidos.has(e.id)) return;
  tzPedidos.add(e.id);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=3&lat=${u.lat}&lon=${u.lng}`);
    const j = await r.json();
    const tz = zonaDe(j.address?.country_code, u.lat, u.lng);
    if (tz) await guardar('etapa', { ...e.datos, ubicacion: { ...u, tz } }, e.id);
  } catch {}
}
function lineaHora(e, s, enVivo) {
  const tz = e?.datos.ubicacion?.tz;
  if (!tz) { if (e) asegurarZona(e); return ''; }
  const dif = diferenciaCasa(tz, s);
  return `🕐 ${enVivo ? `En ${esc(e.datos.ciudad)} son las <b>${horaEn(tz)}</b> (${dif})` : `En ${esc(e.datos.ciudad)}: ${dif}`}`;
}

/* ---------- Clima típico del mes del viaje ---------- */
const NOMBRE_MES = fd(FECHA_MIN).toLocaleDateString('es-CL', { month: 'long' });
const CLIMA = {};
async function climaDelMes(lat, lng) {
  const k = lat.toFixed(2) + ',' + lng.toFixed(2);
  if (CLIMA[k]) return CLIMA[k];
  try { const c = JSON.parse(leerLocal('clima:' + k) || 'null'); if (c) return (CLIMA[k] = c); } catch {}
  const mes = FECHA_MIN.slice(5, 7), y = +FECHA_MIN.slice(0, 4);
  const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=${y - 3}-${mes}-01&end_date=${y - 2}-${mes}-28&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`);
  const j = await r.json(), d = j.daily;
  const idx = d.time.map((t, i) => t.slice(5, 7) === mes ? i : -1).filter(i => i >= 0);
  if (!idx.length) throw new Error('sin datos');
  const prom = arr => idx.reduce((s, i) => s + (arr[i] ?? 0), 0) / idx.length;
  const anios = new Set(idx.map(i => d.time[i].slice(0, 4))).size;
  const res = { max: Math.round(prom(d.temperature_2m_max)), min: Math.round(prom(d.temperature_2m_min)), lluvia: Math.round(idx.filter(i => (d.precipitation_sum[i] || 0) >= 1).length / anios * 30 / (idx.length / anios)) };
  guardarLocal('clima:' + k, JSON.stringify(res));
  return (CLIMA[k] = res);
}
function textoClima(c) {
  const consejo = c.min <= 8 ? ' Lleven abrigo para las noches.' : c.max >= 28 ? ' Hace calor: ropa liviana y bloqueador.' : c.lluvia >= 10 ? ' Lleven paraguas o cortaviento.' : '';
  return `🌤️ En ${NOMBRE_MES} suele haber entre ${c.min}° y ${c.max}°, con unos ${plural(c.lluvia, 'día', 'días')} de lluvia en el mes.${consejo}`;
}
const marcaClima = e => e?.datos.ubicacion?.lat ? `<span class="clima" data-clima="${e.datos.ubicacion.lat},${e.datos.ubicacion.lng}"></span>` : '';
function completarAsync() {
  document.querySelectorAll('[data-clima]').forEach(async el => {
    const [lat, lng] = el.dataset.clima.split(',').map(Number);
    try { const c = await climaDelMes(lat, lng); if (el.isConnected) el.textContent = textoClima(c); } catch { el.remove(); }
  });
}

/* ---------- Monedas: todo convertido a la moneda principal ---------- */
let TASAS = null, tasasPedidas = '';
async function cargarTasas() {
  const base = monedaBase();
  if (tasasPedidas === base) return;
  tasasPedidas = base;
  try { const c = JSON.parse(leerLocal('tasas') || 'null'); if (c && c.base === base && Date.now() - c.t < 12 * 36e5) { TASAS = c; render(); return; } } catch {}
  try {
    const j = await (await fetch('https://open.er-api.com/v6/latest/' + base)).json();
    if (j.result === 'success') { TASAS = { base, r: j.rates, t: Date.now() }; guardarLocal('tasas', JSON.stringify(TASAS)); render(); }
  } catch {}
}
function aBase(v, mon) {
  const base = monedaBase(); mon = (mon || base).toUpperCase();
  if (mon === base) return v;
  if (!TASAS || TASAS.base !== base || !TASAS.r[mon]) return null;
  return v / TASAS.r[mon];
}
function totalBase(items, campo) {
  let t = 0, ok = true, mixto = false;
  for (const x of items) {
    const v = Number(x.datos[campo]); if (!v) continue;
    if ((x.datos.moneda || monedaBase()).toUpperCase() !== monedaBase()) mixto = true;
    const c = aBase(v, x.datos.moneda); if (c == null) ok = false; else t += c;
  }
  return { t, ok, mixto };
}
function textoBase(items, campo) {
  const r = totalBase(items, campo);
  if (!r.ok) return textoTotales(sumarPorMoneda(items, campo));
  return (r.mixto ? '≈ ' : '') + fMonto(r.t, monedaBase());
}
const equivalente = (v, mon) => { const c = aBase(Number(v), mon); return c != null && (mon || monedaBase()).toUpperCase() !== monedaBase() ? ` <span class="autor">≈ ${fMonto(c, monedaBase())}</span>` : ''; };

/* ---------- Google Maps ---------- */
function linkMaps(g, q, texto = 'Cómo llegar') {
  const dest = g?.lat ? `${g.lat},${g.lng}` : q;
  return dest ? `<a class="enlace" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}" target="_blank" rel="noopener">🧭 ${texto}</a>` : '';
}

const normal = s => (s || '').split(',')[0].trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function coordsDeCiudad(nombre) {
  const e = de('etapa').find(x => x.datos.ubicacion?.lat && normal(x.datos.ciudad) === normal(nombre));
  return e ? { q: nombre, lat: e.datos.ubicacion.lat, lng: e.datos.ubicacion.lng } : null;
}
async function ubicarCiudad(nombre) {
  if (!nombre) return null;
  const c = coordsDeCiudad(nombre);
  if (c) return c;
  const g = await geocodificar(nombre);
  return g ? { q: nombre, lat: g.lat, lng: g.lng } : { q: nombre, lat: null, lng: null };
}

/* =========================================================
   Cálculos del viaje
   ========================================================= */
const etapasOrd = () => de('etapa').sort((a, b) => (a.datos.llegada || '').localeCompare(b.datos.llegada || ''));
const conexOrd = () => de('conexion').sort((a, b) => (a.datos.sale || '').localeCompare(b.datos.sale || ''));
const alojActivos = () => de('alojamiento').filter(a => a.datos.estado !== 'Descartado');
const confirmado = a => a.datos.estado === 'Reservado' || a.datos.estado === 'Pagado';

function rangoViaje() {
  const c = conf(), e = etapasOrd();
  return { ini: c.inicio || e[0]?.datos.llegada || '', fin: c.fin || e.reduce((m, x) => (x.datos.salida || '') > m ? x.datos.salida : m, '') };
}

function nochesSinAlojamiento() {
  const { ini, fin } = rangoViaje();
  if (!ini || !fin || dias(ini, fin) <= 0) return [];
  const conf_ = alojActivos().filter(confirmado);
  const faltan = [];
  for (let d = fd(ini); d < fd(fin); d = new Date(d.getTime() + DIA)) {
    const s = iso(d);
    const enAlojamiento = conf_.some(a => a.datos.entrada && a.datos.salida && a.datos.entrada <= s && s < a.datos.salida);
    const viajandoDeNoche = de('conexion').some(x => x.datos.sale && x.datos.llega && x.datos.sale.slice(0, 10) <= s && x.datos.llega.slice(0, 10) > s);
    if (!enAlojamiento && !viajandoDeNoche) faltan.push(s);
  }
  // agrupar noches seguidas
  const grupos = [];
  for (const s of faltan) {
    const g = grupos.at(-1);
    if (g && dias(g.hasta, s) === 1) g.hasta = s; else grupos.push({ desde: s, hasta: s });
  }
  return grupos;
}

function conexionesAjustadas() {
  const c = conexOrd().filter(x => x.datos.sale), res = [];
  for (let i = 1; i < c.length; i++) {
    const prev = c[i - 1].datos, act = c[i].datos;
    if (!prev.llega) continue;
    const ms = new Date(act.sale) - new Date(prev.llega);
    if (ms < 0) res.push(`${prev.desde} → ${prev.hasta} llega después de que sale ${act.desde} → ${act.hasta}.`);
    else if (ms < 3 * 36e5 && fd(prev.llega.slice(0, 10)).getTime() === fd(act.sale.slice(0, 10)).getTime())
      res.push(`Solo ${fDur(ms)} entre la llegada a ${prev.hasta} y la salida hacia ${act.hasta}.`);
  }
  return res;
}

function sumarPorMoneda(lista, campoMonto) {
  const t = {};
  for (const x of lista) {
    const v = Number(x.datos[campoMonto]);
    if (!v) continue;
    const m = (x.datos.moneda || monedaBase()).toUpperCase();
    t[m] = (t[m] || 0) + v;
  }
  return t;
}
const textoTotales = t => Object.keys(t).length ? Object.entries(t).map(([m, v]) => fMonto(v, m)).join(' + ') : '—';

function alojamientoDeEtapa(e) {
  const { llegada, salida, ciudad } = e.datos;
  const cand = alojActivos().filter(a =>
    (a.datos.entrada && a.datos.salida && llegada && salida && a.datos.entrada < salida && a.datos.salida > llegada) ||
    (ciudad && a.datos.ciudad && a.datos.ciudad.trim().toLowerCase() === ciudad.trim().toLowerCase()));
  const rango = { Pagado: 0, Reservado: 1, Evaluando: 2 };
  cand.sort((a, b) => (rango[a.datos.estado] ?? 3) - (rango[b.datos.estado] ?? 3));
  return cand;
}

// Paradas y conexiones intercaladas por fecha, con la parada numerada
function eventosRecorrido() {
  const ev = [
    ...etapasOrd().map(e => ({ k: (e.datos.llegada || '') + 'T23:59', e })),
    ...conexOrd().map(x => ({ k: x.datos.sale || '', x })),
  ].sort((a, b) => a.k.localeCompare(b.k));
  let n = 0;
  for (const x of ev) if (x.e) x.n = ++n;
  return ev;
}

      : (noch ? '<span style="color:var(--alerta)">🛏️ Falta alojamiento</span>' : '');
    return `<li class="estacion" ${attr(ev.e.id, true)}><span class="punto">${ev.n}</span><div>

  }).join('');
}

function vResumen() {
  const c = conf(), { ini, fin } = rangoViaje(), etapas = etapasOrd();
  let cifra = '—', leyenda = 'Agrega las fechas en Ajustes';
  if (ini) {
    const hoy = iso(new Date()), f = dias(hoy, ini);
    if (f > 0) { cifra = f; leyenda = f === 1 ? 'día para salir' : 'días para salir'; }
    else if (fin && dias(hoy, fin) >= 0) { cifra = 1 - f; leyenda = `día de viaje de ${dias(ini, fin) + 1}`; }
    else if (f === 0) { cifra = '¡Hoy!'; leyenda = 'empieza el viaje'; }
    else { cifra = '✓'; leyenda = 'viaje terminado'; }
  }
  const rango = ini ? `${fFecha(ini, { day: 'numeric', month: 'long' })}${fin ? ' al ' + fFecha(fin, { day: 'numeric', month: 'long', year: 'numeric' }) : ''}` : 'Sin fechas todavía';

  // avisos
  const avisos = [];
  if (!itemConfig()) avisos.push(`<div class="aviso info">Empieza por ponerle nombre y fechas al viaje. <button class="btn chico sec" data-ir="ajustes">Ir a Ajustes</button></div>`);
  for (const g of nochesSinAlojamiento()) {
    const n = dias(g.desde, g.hasta) + 1;
    avisos.push(`<div class="aviso">🛏️ Sin alojamiento confirmado: noche${n > 1 ? 's' : ''} del ${fFecha(g.desde)}${n > 1 ? ' al ' + fFecha(g.hasta) : ''} (${plural(n, 'noche', 'noches')}).</div>`);
  }
  for (const t of conexionesAjustadas()) avisos.push(`<div class="aviso">⏱️ ${esc(t)}</div>`);
  const porReservar = de('conexion').filter(x => x.datos.estado === 'Por reservar').length;
  if (porReservar) avisos.push(`<div class="aviso">✈️ ${plural(porReservar, 'conexión por reservar', 'conexiones por reservar')}.</div>`);
  const pendientes = de('tarea').filter(t => !t.datos.hecho).length;
  if (pendientes) avisos.push(`<div class="aviso info">✅ ${plural(pendientes, 'tarea pendiente', 'tareas pendientes')} en la checklist.</div>`);
  if (itemConfig() && etapas.length && !avisos.length) avisos.push(`<div class="aviso ok">Todo en orden: alojamientos y conexiones cubiertos.</div>`);

  // cifras
  const noches = etapas.reduce((s, e) => s + Math.max(0, dias(e.datos.llegada, e.datos.salida) || 0), 0);
  const cifras = `<ul class="cifras">
    <li><b>${etapas.length}</b>${etapas.length === 1 ? 'destino' : 'destinos'}</li>
    <li><b>${noches}</b>noches</li>
    <li><b>${alojActivos().filter(confirmado).length}</b>alojamientos confirmados</li>
    <li><b>${textoBase([...alojActivos(), ...de('conexion'), ...de('lugar')], 'precio')}</b>en reservas y panoramas</li></ul>`;

  const eventos = eventosRecorrido(), linea = lineaRecorrido(eventos, false);

  return `<section class="boleto"><div class="izq"><h1>${esc(c.nombre)}</h1><p>${rango}${viajeros().length ? '<br>' + viajeros().map(esc).join(' y ') : ''}</p></div>
    <div class="der"><div class="cifra">${cifra}</div><span>${leyenda}</span></div></section>
    ${cifras}<div class="avisos">${avisos.join('')}</div>
    <div class="titulo"><div><h2>El recorrido</h2></div><button class="btn sec" data-nuevo="etapa">＋ Destino</button></div>
    ${etapas.length || eventos.length ? `<ol class="metro">${linea}</ol>` : vacio('Agrega el primer destino del viaje para dibujar el recorrido.', 'etapa', 'Agregar destino')}`;
}

      <div class="fila"><div><b>${esc(d.medio || 'Traslado')}</b>${serv ? ` <span class="tc-serv">${serv}</span>` : ''}</div>${d.estado ? `<span class="estado ${esc(d.estado.replace(' ', ''))}">${esc(d.estado)}</span>` : ''}</div>
      <div class="tc-horas">
        <div><small>${esc(d.desde)}</small><strong>${hora(d.sale) || '—'}</strong><small>${diaCorto(d.sale)}</small></div>
        <div class="tc-linea"><span>${dur > 0 ? fDur(dur) : ''}</span></div>
        <div class="der"><small>${esc(d.hasta)}</small><strong>${hora(d.llega) || '—'}</strong><small>${diaCorto(d.llega)}</small></div>
      </div>
      ${d.codigo || d.enlace ? `<div class="fila">${d.codigo ? `<span class="autor">Reserva ${esc(d.codigo)}</span>` : '<span></span>'}${enlace(d.enlace)}</div>` : ''}
    </div></div>`;
}

// Bloque entre dos destinos: los traslados (con escalas) o una invitación a agregarlos
function conectorHTML(lista, origen, destino, salida) {
  if (!lista.length) {
    const texto = origen && destino ? `¿Cómo van de ${esc(origen)} a ${esc(destino)}?` : destino ? `¿Cómo llegan a ${esc(destino)}?` : `¿Cómo vuelven desde ${esc(origen)}?`;
    return `<div class="conector sin"><span class="burbuja" aria-hidden="true">?</span><div><b>${texto}</b><br>
      <button class="btn chico sec" data-nuevo="conexion" ${pre({ desde: origen || '', hasta: destino || '', sale: salida ? salida + 'T10:00' : '' })}>＋ Agregar traslado</button></div></div>`;
  }
  return `<div class="conector">${lista.map((x, i) => {
    let escala = '';
    if (i > 0) {
      const a = lista[i - 1].datos, ms = a.llega && x.datos.sale ? new Date(x.datos.sale) - new Date(a.llega) : null;
      if (ms != null) escala = `<div class="escala ${ms < 36e5 * 1.5 ? 'justa' : ''}">⏱️ ${ms < 0 ? 'Ojo: los horarios se superponen' : ms < 864e5 ? `Escala en ${esc(a.hasta)}: ${fDur(ms)}` : `${fDur(ms)} en ${esc(a.hasta)}`}</div>`;
    }
    return escala + tramoCard(x);
  }).join('')}</div>`;
}

// Reparte las conexiones: ida, entre cada par de destinos, y regreso
function tramosRecorrido() {
  const e = etapasOrd(), cx = conexOrd(), usadas = new Set(), entre = [];
  const dia = x => (x.datos.sale || '').slice(0, 10);
  const tomar = f => { const r = cx.filter(x => !usadas.has(x.id) && f(x)); r.forEach(x => usadas.add(x.id)); return r; };
  for (let i = 1; i < e.length; i++) {
    const a = e[i - 1].datos, b = e[i].datos;
    entre[i] = tomar(x => normal(x.datos.desde) === normal(a.ciudad) && normal(x.datos.hasta) === normal(b.ciudad));
  }
  for (let i = 1; i < e.length; i++) {
    const a = e[i - 1].datos, b = e[i].datos;
    entre[i].push(...tomar(x => dia(x) && a.salida && b.llegada && dia(x) >= a.salida && dia(x) <= b.llegada));
    entre[i].sort((p, q) => (p.datos.sale || '').localeCompare(q.datos.sale || ''));
  }
  const ida = e.length ? tomar(x => dia(x) && dia(x) <= (e[0].datos.llegada || '')) : [];
  const regreso = e.length ? tomar(x => dia(x) && dia(x) >= (e.at(-1).datos.salida || '9')) : [];
  return { e, entre, ida, regreso, sueltas: cx.filter(x => !usadas.has(x.id)) };
}

function destinoCard(e, n) {
  const d = e.datos, noch = Math.max(0, dias(d.llegada, d.salida) || 0);
  const al = alojamientoDeEtapa(e), pan = panoramasDe(d.ciudad);
  const chipAl = al.length
    ? `<span class="chip ${confirmado(al[0]) ? 'ok' : ''}">🛏️ ${esc(al[0].datos.nombre)}${confirmado(al[0]) ? '' : ' (evaluando)'}</span>`
    : (noch ? '<span class="chip alerta">🛏️ Falta alojamiento</span>' : '');
  return `<article class="destino-card" data-destino="${e.id}" tabindex="0" role="button" aria-label="Ver ${esc(d.ciudad)}">
    <span class="num">${n}</span>
    <div class="dc"><h3>${esc(d.ciudad)}</h3>
      <p>${d.pais ? esc(d.pais) + '. ' : ''}${fFecha(d.llegada, { weekday: 'short', day: 'numeric', month: 'short' })} a ${fFecha(d.salida, { weekday: 'short', day: 'numeric', month: 'short' })}</p>
      <div class="chips">${noch ? `<span class="noches">${plural(noch, 'noche', 'noches')}</span>` : ''}${chipAl}<span class="chip">🎯 ${plural(pan.length, 'panorama', 'panoramas')}</span></div></div>
    <span class="flecha" aria-hidden="true">›</span></article>`;
}

function vRecorrido() {
  const t = tramosRecorrido(), e = t.e;
  const cab = encabezado('Recorrido', 'Toquen un destino para ver todo lo que tienen ahí: alojamiento, panoramas y cómo llegar.', 'etapa', 'Destino');
  if (!e.length) return cab + vacio('Agreguen el primer destino del viaje.', 'etapa', 'Agregar destino');
  let html = `<div class="cadena"><div class="extremo">🏠 Salida</div>${conectorHTML(t.ida, '', e[0].datos.ciudad, e[0].datos.llegada)}`;
  e.forEach((x, i) => {
    if (i > 0) html += conectorHTML(t.entre[i], e[i - 1].datos.ciudad, x.datos.ciudad, e[i - 1].datos.salida);
    html += destinoCard(x, i + 1);
  });
  html += conectorHTML(t.regreso, e.at(-1).datos.ciudad, '', e.at(-1).datos.salida) + `<div class="extremo">🏠 Regreso</div></div>`;
  if (t.sueltas.length) html += `<h3 class="grupo">Otros traslados</h3><div class="lista">${t.sueltas.map(tramoCard).join('')}</div>`;
  return cab + html;
}

      ${sig ? `<button class="btn sec chico" data-destino="${sig.id}">${esc(sig.datos.ciudad)} →</button>` : ''}</div>
    <section class="dest-hero"><span class="num grande">${idx + 1}</span>
      <div class="dh"><p>Destino ${idx + 1} de ${t.e.length}</p><h1>${esc(d.ciudad)}</h1>
        <p>${d.pais ? esc(d.pais) + '. ' : ''}${fFecha(d.llegada, { weekday: 'long', day: 'numeric', month: 'long' })} al ${fFecha(d.salida, { weekday: 'long', day: 'numeric', month: 'long' })}${noch ? `, ${plural(noch, 'noche', 'noches')}` : ''}</p>
        ${d.enlace ? `<p>${enlace(d.enlace)}</p>` : ''}
        <div class="dh-extra">${lineaHora(e, d.llegada, false) ? `<span>${lineaHora(e, d.llegada, false)}</span>` : ''}${marcaClima(e)}</div></div>
      <button class="btn sec chico" data-editar="${e.id}">Editar destino</button></section>
    ${d.notas ? `<div class="nota-destino">${esc(d.notas)}</div>` : ''}
    <div class="dest-grid">

        <section><h3 class="grupo">Cómo llegan${ant ? ` desde ${esc(ant.datos.ciudad)}` : ''}</h3>${conectorHTML(llegan, ant?.datos.ciudad || '', d.ciudad, ant?.datos.salida || d.llegada)}</section>
        <section><div class="sub-titulo"><h3 class="grupo">Dónde duermen</h3><button class="btn sec chico" data-nuevo="alojamiento" ${pre({ ciudad: d.ciudad, entrada: d.llegada, salida: d.salida })}>＋ Alojamiento</button></div>
          ${aloj.length ? `<div class="lista">${aloj.map(tarjetaAlojamiento).join('')}</div>` : `<div class="vacio chico">${noch ? 'Todavía no hay alojamiento para estas noches.' : 'Sin noches aquí.'}</div>`}</section>
        <section><div class="sub-titulo"><h3 class="grupo">Panoramas en ${esc(d.ciudad)}</h3><button class="btn sec chico" data-nuevo="lugar" ${pre({ ciudad: d.ciudad })}>＋ Panorama</button></div>
          ${pan.length ? orden.map(cat => `<h4 class="cat">${ICONO_CAT[cat] || '📍'} ${esc(cat)}</h4><div class="lista">${grupos[cat].map(tarjetaLugar).join('')}</div>`).join('')
            : `<div class="vacio chico">Agreguen lo que quieren ver, comer o hacer en ${esc(d.ciudad)}.</div>`}</section>
        ${planDiaADia(e)}

        <section><h3 class="grupo">Cómo siguen${sig ? ` hacia ${esc(sig.datos.ciudad)}` : ' (regreso)'}</h3>${conectorHTML(siguen, d.ciudad, sig?.datos.ciudad || '', d.salida)}</section>

          ${diasDe(e).map(s => `<button class="pastilla" data-dia-mapa="${s}" aria-pressed="${st.diaMapa === s}">${fFecha(s, { weekday: 'short', day: 'numeric' })}</button>`).join('')}</div>

function dibujarMapaDestino() {
  const el = $('#mapaDestino'), e = porId(st.destino); if (!el || !e) return;
  mapa = L.map(el);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
  const pts = [], css = getComputedStyle(document.documentElement);
  const cMar = css.getPropertyValue('--mar').trim(), cRuta = css.getPropertyValue('--ruta').trim();
  const dia = st.diaMapa, u = e.datos.ubicacion;
  if (u?.lat && !dia) pts.push([u.lat, u.lng]);
  const alojs = dia ? alojamientosDeNoche(dia, true).concat(alojamientosDeNoche(dia, true).length ? [] : alojamientoDeEtapa(e).slice(0, 1)) : alojamientoDeEtapa(e);
  alojs.forEach(a => {
    const g = a.datos.ubicacion; if (!g?.lat) return; pts.push([g.lat, g.lng]);
    L.circleMarker([g.lat, g.lng], { radius: 10, color: '#fff', weight: 3, fillColor: cMar, fillOpacity: 1 })
      .bindTooltip('🛏️ ' + esc(a.datos.nombre), { direction: 'top', offset: [0, -8] })
      .bindPopup(`<b>🛏️ ${esc(a.datos.nombre)}</b><br>${esc(a.datos.estado || '')}${a.datos.enlace ? '<br>' + enlace(a.datos.enlace, 'Ver alojamiento') : ''}<br>${linkMaps(g)}`).addTo(mapa);
  });
  const lugares = dia ? panoramasDelDia(dia) : panoramasDe(e.datos.ciudad);
  const ruta = dia && alojs[0]?.datos.ubicacion?.lat ? [[alojs[0].datos.ubicacion.lat, alojs[0].datos.ubicacion.lng]] : [];
  lugares.forEach((l, i) => {
    const g = l.datos.ubicacion; if (!g?.lat) return; pts.push([g.lat, g.lng]);
    if (dia) ruta.push([g.lat, g.lng]);
    L.marker([g.lat, g.lng], { icon: dia ? L.divIcon({ className: 'num-mapa', html: String(i + 1), iconSize: [30, 30] }) : L.divIcon({ className: 'icono-medio' + (l.datos.visitado ? ' hecho' : ''), html: ICONO_CAT[l.datos.categoria] || '📍', iconSize: [30, 30] }) })
      .bindTooltip(esc(l.datos.nombre), { direction: 'top', offset: [0, -14], permanent: !!dia })
      .bindPopup(`<b>${esc(l.datos.nombre)}</b>${l.datos.momento ? '<br>' + l.datos.momento : ''}<br>❤️ ${(l.datos.votos || []).length}${l.datos.enlace ? '<br>' + enlace(l.datos.enlace) : ''}<br>${linkMaps(g)}`).addTo(mapa);
  });
  if (ruta.length > 1) L.polyline(ruta, { color: cRuta, weight: 5, dashArray: '1 10', lineCap: 'round' }).addTo(mapa);
  if (pts.length > 1) mapa.fitBounds(pts, { padding: [40, 40], maxZoom: 15 });
  else if (pts.length) mapa.setView(pts[0], dia ? 14 : 12);
  else if (u?.lat) mapa.setView([u.lat, u.lng], 12);
  else mapa.setView([-20, -40], 2);
  setTimeout(() => mapa?.invalidateSize(), 50);
}

// ---------- Días del viaje ----------
function rangoDias(a, b) { const r = []; if (!a || !b) return r; for (let d = fd(a); d <= fd(b); d = new Date(d.getTime() + DIA)) r.push(iso(d)); return r; }
const diasViaje = () => { const { ini, fin } = rangoViaje(); return rangoDias(ini, fin); };
const diasDe = e => rangoDias(e.datos.llegada, e.datos.salida);
const etapaDeCiudad = c => etapasOrd().find(e => normal(e.datos.ciudad) === normal(c));
function destinoDelDia(s) {
  const e = etapasOrd();
  return e.find(x => x.datos.llegada <= s && s < x.datos.salida) || e.find(x => x.datos.salida === s) || null;
}
const colorDe = e => e ? PALETA[Math.max(0, etapasOrd().findIndex(x => x.id === e.id)) % PALETA.length] : '';
function opcionesDias() {
  return [['', 'Sin día asignado'], ...diasViaje().map(s => { const e = destinoDelDia(s); return [s, fFecha(s, { weekday: 'short', day: 'numeric', month: 'short' }) + (e ? ' en ' + e.datos.ciudad : '')]; })];
}
function alojamientosDeNoche(s, soloConfirmados) {
  return alojActivos().filter(a => a.datos.entrada && a.datos.salida && a.datos.entrada <= s && s < a.datos.salida && (!soloConfirmados || confirmado(a)))
    .sort((a, b) => (confirmado(b) ? 1 : 0) - (confirmado(a) ? 1 : 0));
}
const ordenMomento = l => { const i = MOMENTOS.indexOf(l.datos.momento); return i < 0 ? 3 : i; };
const panoramasDelDia = s => de('lugar').filter(l => l.datos.dia === s).sort((a, b) => ordenMomento(a) - ordenMomento(b) || (a.creado || '').localeCompare(b.creado || ''));

function selectorDia(l) {
  const e = etapaDeCiudad(l.datos.ciudad), dias_ = e ? diasDe(e) : diasViaje();
  return `<select class="mini" data-asignar="${l.id}" aria-label="Día para ${esc(l.datos.nombre)}">
    <option value="">Sin día</option>${dias_.map(s => `<option value="${s}" ${l.datos.dia === s ? 'selected' : ''}>${fFecha(s, { weekday: 'short', day: 'numeric', month: 'short' })}</option>`).join('')}</select>
    <select class="mini" data-asignar-momento="${l.id}" aria-label="Momento"><option value="">Cualquier hora</option>${MOMENTOS.map(m => `<option ${l.datos.momento === m ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
}
function filaPanorama(l, conSelector) {
  const d = l.datos;
  return `<div class="fila-pan ${d.visitado ? 'hecha' : ''}"><span class="fp-ico" aria-hidden="true">${ICONO_CAT[d.categoria] || '📍'}</span>
    <div class="fp-txt" data-editar="${l.id}"><b>${esc(d.nombre)}</b>${d.momento && !conSelector ? `<small>${esc(d.momento)}</small>` : ''}</div>
    <div class="fp-acc">${linkMaps(d.ubicacion, [d.nombre, d.ciudad].filter(Boolean).join(', '), 'Ir')}${conSelector ? selectorDia(l) : ''}</div></div>`;
}

function planDiaADia(e) {
  const d = e.datos, pan = panoramasDe(d.ciudad), sinDia = pan.filter(l => !l.datos.dia);
  if (!pan.length) return '';
  return `<section><h3 class="grupo">Plan día a día</h3>
    <p class="autor">Asignen cada panorama a un día y momento. En el mapa pueden ver el recorrido de cada día.</p>
    <div class="plan">${diasDe(e).map(s => {
      const lista = panoramasDelDia(s);
      return `<div class="plan-dia"><div class="pd-cab"><b>${fFecha(s, { weekday: 'long', day: 'numeric', month: 'short' })}</b>
        <span class="pd-acc"><button class="enlace-titulo" data-dia-mapa="${s}">Ver en el mapa</button><button class="enlace-titulo" data-abrir-dia="${s}">Abrir día ›</button></span></div>
        ${lista.length ? lista.map(l => filaPanorama(l, true)).join('') : '<p class="autor">Día libre.</p>'}</div>`;
    }).join('')}</div>
    ${sinDia.length ? `<h4 class="cat">Todavía sin día</h4><div class="plan-dia">${sinDia.map(l => filaPanorama(l, true)).join('')}</div>` : ''}</section>`;
}

function presupuestoDestino(e, llegan) {
  const d = e.datos, base = monedaBase();
  const al = alojamientoDeEtapa(e)[0];
  const reservas = [...(al ? [al] : []), ...llegan, ...panoramasDe(d.ciudad)];
  const gastos = de('gasto').filter(g => normal(g.datos.destino) === normal(d.ciudad));
  const est = totalBase(reservas, 'precio'), gas = totalBase(gastos, 'monto'), pres = Number(d.presupuesto) || 0;
  if (!est.t && !gas.t && !pres) return '';
  const pct = pres ? Math.min(100, Math.round(gas.t / pres * 100)) : 0;
  return `<section><h3 class="grupo">Presupuesto en ${esc(d.ciudad)}</h3><div class="balance">
    ${pres ? `<div class="barra" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%;background:${gas.t > pres ? 'var(--alerta)' : 'var(--ok)'}"></span></div>
      <p>Gastado <b>${fMonto(gas.t, base)}</b> de <b>${fMonto(pres, base)}</b>${gas.t > pres ? ' <span style="color:var(--alerta)">(se pasaron)</span>' : `, quedan ${fMonto(pres - gas.t, base)}`}.</p>`
      : `<p class="autor">Pueden ponerle un presupuesto a este destino con "Editar destino".</p>`}
    ${est.t ? `<p>Alojamiento, llegada y panoramas: <b>${textoBase(reservas, 'precio')}</b></p>` : ''}
    ${gas.t ? `<p>Gastos registrados aquí: <b>${textoBase(gastos, 'monto')}</b></p>` : ''}</div></section>`;
}

// ---------- Detalle de un día (lo usan Calendario y Hoy) ----------
function detalleDia(s, enVivo) {
  const e = destinoDelDia(s), lista = diasViaje(), n = lista.indexOf(s) + 1, color = colorDe(e) || 'var(--suave)';
  const cx = conexOrd().filter(x => (x.datos.sale || '').slice(0, 10) === s);
  const noche = alojamientosDeNoche(s), salen = alojActivos().filter(a => a.datos.salida === s && confirmado(a));
  const pan = panoramasDelDia(s);
  const ultimo = s === lista.at(-1);
  const pendientes = e ? panoramasDe(e.datos.ciudad).filter(l => !l.datos.dia) : [];
  const porMomento = {};
  pan.forEach(l => (porMomento[l.datos.momento || 'A cualquier hora'] ||= []).push(l));
  const hora = lineaHora(e, s, enVivo);
  return `<div class="dia-detalle" style="--c:${color}">
    <div class="dia-cab"><div><p>${n ? `Día ${n} de ${lista.length}` : 'Fuera de las fechas del viaje'}</p>
      <h2>${fFecha(s, { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
      ${e ? `<button class="enlace-titulo destino-dia" data-destino="${e.id}">📍 ${esc(e.datos.ciudad)} ›</button>` : ''}</div>
      <div class="dia-extra">${hora ? `<span>${hora}</span>` : ''}${marcaClima(e)}</div></div>
    ${cx.length ? `<h3 class="grupo">Traslados</h3>${conectorHTML(cx)}` : ''}
    <h3 class="grupo">Dónde duermen</h3>
    ${salen.map(a => `<div class="aviso info">🧳 Check-out de <b>${esc(a.datos.nombre)}</b>${a.datos.horaSalida ? ` a las <b>${a.datos.horaSalida}</b>` : ''}.</div>`).join('')}
    ${noche.length ? noche.slice(0, 1).map(a => `<div class="tarjeta aloj-dia" data-editar="${a.id}">
        <div class="fila"><h4>🛏️ ${esc(a.datos.nombre)}</h4><span class="estado ${esc(a.datos.estado)}">${esc(a.datos.estado)}</span></div>
        ${a.datos.entrada === s ? `<div class="meta"><span>Check-in hoy${a.datos.horaEntrada ? ` desde las <b>${a.datos.horaEntrada}</b>` : ''}</span></div>` : ''}
        ${a.datos.direccion ? `<div class="meta">${esc(a.datos.direccion)}</div>` : ''}

      : ultimo ? '<p class="autor">Último día: vuelta a casa. 🏠</p>'

function vCalendario() {

function vGastos() {
  const lista = de('gasto').sort((a, b) => (b.datos.fecha || '').localeCompare(a.datos.fecha || ''));
  const [v1, v2] = viajeros();
  let balance = '';
  if (lista.length) {
    const tot = sumarPorMoneda(lista, 'monto'), tb = totalBase(lista, 'monto');
    const lineas = [`<p>Total gastado: <b>${textoBase(lista, 'monto')}</b>${tb.ok && tb.mixto ? ` <span class="autor">(${textoTotales(tot)})</span>` : ''}</p>`];
    if (v1 && v2 && tb.ok) {
      const base = monedaBase(), pag = { [v1]: 0, [v2]: 0 }; let saldo = 0;
      for (const g of lista) {
        const x = aBase(Number(g.datos.monto) || 0, g.datos.moneda) || 0, p = g.datos.pagadoPor;
        if (p in pag) pag[p] += x;
        if (g.datos.compartido === 'No') continue;
        if (p === v1) saldo += x / 2; else if (p === v2) saldo -= x / 2;
      }
      lineas.push(`<p>${esc(v1)} pagó ${fMonto(pag[v1], base)} y ${esc(v2)} pagó ${fMonto(pag[v2], base)}. ${Math.abs(saldo) < 1 ? '<b>Están a mano.</b>' : `<b>${esc(saldo > 0 ? v2 : v1)} le debe ${tb.mixto ? '≈ ' : ''}${fMonto(Math.abs(saldo), base)} a ${esc(saldo > 0 ? v1 : v2)}.</b>`}</p>`);
      if (tb.mixto) lineas.push(`<p class="autor">Los montos en otras monedas están convertidos a ${base} con el tipo de cambio de hoy.</p>`);
    } else if (v1 && v2) {
      for (const m of Object.keys(tot)) {
        let saldo = 0; // positivo: v2 le debe a v1
        const pag = { [v1]: 0, [v2]: 0 };
        for (const g of lista.filter(g => (g.datos.moneda || monedaBase()).toUpperCase() === m)) {
          const x = Number(g.datos.monto) || 0, p = g.datos.pagadoPor;
          if (p in pag) pag[p] += x;
          if (g.datos.compartido === 'No') continue;
          if (p === v1) saldo += x / 2; else if (p === v2) saldo -= x / 2;
        }
        lineas.push(`<p>${esc(v1)} pagó ${fMonto(pag[v1], m)} y ${esc(v2)} pagó ${fMonto(pag[v2], m)}. ${Math.abs(saldo) < 0.01 ? '<b>Están a mano.</b>' : `<b>${esc(saldo > 0 ? v2 : v1)} le debe ${fMonto(Math.abs(saldo), m)} a ${esc(saldo > 0 ? v1 : v2)}.</b>`}</p>`);
      }
    } else lineas.push('<p class="autor">Escriban sus nombres en Ajustes para ver cuánto le debe uno al otro.</p>');
    balance = `<div class="balance"><h3>Cuentas claras</h3>${lineas.join('')}</div>`;
  }
  return encabezado('Gastos', 'Lo que ya pagaron, y quién lo pagó.', 'gasto', 'Gasto') + balance +
    (lista.length ? `<div class="lista">${lista.map(g => {
      const d = g.datos;
      return `<div class="tarjeta" data-editar="${g.id}"><div class="fila"><h4>${esc(d.concepto)}</h4><span class="monto">${fMonto(d.monto, d.moneda)}${equivalente(d.monto, d.moneda)}</span></div>

    }).join('')}</div>` : vacio('Aún no hay gastos registrados.', 'gasto', 'Agregar gasto'));
}

// Curva suave entre dos puntos (para los vuelos)
function arco(a, b) {
  let [la1, lo1] = a, [la2, lo2] = b;
  if (lo2 - lo1 > 180) lo2 -= 360; else if (lo1 - lo2 > 180) lo2 += 360;
  const cx = (la1 + la2) / 2 - (lo2 - lo1) * 0.18, cy = (lo1 + lo2) / 2 + (la2 - la1) * 0.18, pts = [];
  for (let t = 0; t <= 1.0001; t += 1 / 40) pts.push([(1 - t) ** 2 * la1 + 2 * (1 - t) * t * cx + t * t * la2, (1 - t) ** 2 * lo1 + 2 * (1 - t) * t * cy + t * t * lo2]);
  return pts;
}

function dibujarMapa() {
  const el = $('#mapa'); if (!el) return;
  const suave = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  mapa = L.map(el, { zoomControl: true, worldCopyJump: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
  const puntos = [], focos = {};
  const cMar = getComputedStyle(document.documentElement).getPropertyValue('--mar').trim();
  const etapas = etapasOrd();
  const numDe = {};
  eventosRecorrido().forEach(e => { if (e.e) numDe[e.e.id] = e.n; });

  // Paradas numeradas con su nombre siempre visible
  const ciudadesConMarca = new Set();
  etapas.forEach(e => {
    const u = e.datos.ubicacion; if (!u?.lat) return;
    const d = e.datos, n = numDe[e.id], p = [u.lat, u.lng], noch = Math.max(0, dias(d.llegada, d.salida) || 0);
    const al = alojamientoDeEtapa(e)[0];
    ciudadesConMarca.add(normal(d.ciudad)); puntos.push(p);
    const m = L.marker(p, { icon: L.divIcon({ className: 'num-mapa', html: String(n), iconSize: [30, 30] }), zIndexOffset: 1000 })
      .bindTooltip(esc(d.ciudad), { permanent: true, direction: 'right', offset: [14, 0], className: 'etiqueta' })
      .bindPopup(`<b>${n}. ${esc(d.ciudad)}</b><br>${fFecha(d.llegada)} a ${fFecha(d.salida)} (${plural(noch, 'noche', 'noches')})${al ? `<br>🛏️ ${esc(al.datos.nombre)}${al.datos.enlace ? '<br>' + enlace(al.datos.enlace, 'Ver alojamiento') : ''}` : ''}${d.enlace ? '<br>' + enlace(d.enlace) : ''}<br><button class="btn sec chico" data-destino="${e.id}" style="margin-top:6px">Ver destino ›</button>`)
      .addTo(mapa);
    focos[e.id] = { centro: p, zoom: 12, capa: m };
  });

  // Conexiones dibujadas según el medio de transporte
  const tramosDibujados = new Set();
  conexOrd().forEach(x => {
    const d = x.datos;
    const a = d.geoDesde?.lat ? d.geoDesde : coordsDeCiudad(d.desde), b = d.geoHasta?.lat ? d.geoHasta : coordsDeCiudad(d.hasta);
    if (!a?.lat || !b?.lat) return;
    tramosDibujados.add(normal(d.desde) + '>' + normal(d.hasta));
    const s = ESTILO_MEDIO[d.medio] || ESTILO_MEDIO.Otro;
    const pts = s.arco ? arco([a.lat, a.lng], [b.lat, b.lng]) : [[a.lat, a.lng], [b.lat, b.lng]];
    const linea = L.polyline(pts, { ...s, opacity: .9 }).addTo(mapa);
    const medio = s.arco ? pts[Math.floor(pts.length / 2)] : [(a.lat + b.lat) / 2, (a.lng + b.lng) / 2];
    const serv = nombreServicio(d);
    const popup = `<b>${ICONO_MEDIO[d.medio] || '🧳'} ${esc(d.desde)} → ${esc(d.hasta)}</b>${serv ? '<br>' + serv : ''}<br>Sale ${fHora(d.sale)}${d.llega ? '<br>Llega ' + fHora(d.llega) : ''}${d.codigo ? '<br>Reserva ' + esc(d.codigo) : ''}${d.enlace ? '<br>' + enlace(d.enlace) : ''}`;
    const icono = L.marker(medio, { icon: L.divIcon({ className: 'icono-medio', html: ICONO_MEDIO[d.medio] || '🧳', iconSize: [30, 30] }), zIndexOffset: 500 }).bindPopup(popup).addTo(mapa);
    linea.bindPopup(popup);
    puntos.push([a.lat, a.lng], [b.lat, b.lng]);
    // ciudades de origen o destino que no son paradas (por ejemplo, la casa)
    for (const [c, nom] of [[a, d.desde], [b, d.hasta]]) {
      if (ciudadesConMarca.has(normal(nom))) continue;
      ciudadesConMarca.add(normal(nom));
      L.circleMarker([c.lat, c.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#5A6B7C', fillOpacity: 1 })
        .bindTooltip(esc(nom.split(',')[0]), { permanent: true, direction: 'right', offset: [8, 0], className: 'etiqueta suave' }).addTo(mapa);
    }
    focos[x.id] = { limites: linea.getBounds(), capa: icono };
  });

  // Paradas seguidas sin una conexión registrada entre ellas
  for (let i = 1; i < etapas.length; i++) {
    const a = etapas[i - 1].datos, b = etapas[i].datos;
    if (!a.ubicacion?.lat || !b.ubicacion?.lat || tramosDibujados.has(normal(a.ciudad) + '>' + normal(b.ciudad))) continue;
    L.polyline([[a.ubicacion.lat, a.ubicacion.lng], [b.ubicacion.lat, b.ubicacion.lng]], { color: '#9AA6B2', weight: 2, dashArray: '3 7' })
      .bindTooltip(`Traslado ${esc(a.ciudad)} → ${esc(b.ciudad)} por definir`).addTo(mapa);
  }

  alojActivos().forEach(a => {
    const u = a.datos.ubicacion; if (!u?.lat) return; puntos.push([u.lat, u.lng]);
    L.circleMarker([u.lat, u.lng], { radius: 8, color: '#fff', weight: 2, fillColor: cMar, fillOpacity: 1 })
      .bindPopup(`<b>🛏️ ${esc(a.datos.nombre)}</b><br>${esc(a.datos.estado || '')}${a.datos.entrada ? `<br>Check-in ${fFecha(a.datos.entrada)}${a.datos.horaEntrada ? ', ' + a.datos.horaEntrada : ''}<br>Check-out ${fFecha(a.datos.salida)}${a.datos.horaSalida ? ', ' + a.datos.horaSalida : ''}` : ''}${a.datos.enlace ? '<br>' + enlace(a.datos.enlace, 'Ver alojamiento') : ''}`).addTo(mapa);
  });
  de('lugar').forEach(l => {
    const u = l.datos.ubicacion; if (!u?.lat) return;
    L.circleMarker([u.lat, u.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#8E5BC7', fillOpacity: l.datos.visitado ? .45 : 1 })
      .bindPopup(`<b>${esc(l.datos.nombre)}</b><br>❤️ ${(l.datos.votos || []).length}${l.datos.enlace ? '<br>' + enlace(l.datos.enlace) : ''}`).addTo(mapa);
  });

  const verTodo = () => puntos.length ? mapa.fitBounds(puntos, { padding: [50, 50], maxZoom: 12 }) : mapa.setView([-20, -40], 2);
  if (st.mapaVista) mapa.setView(st.mapaVista.c, st.mapaVista.z); else verTodo();
  mapa.on('moveend', () => { st.mapaVista = { c: mapa.getCenter(), z: mapa.getZoom() }; });
  setTimeout(() => mapa?.invalidateSize(), 50);

  // Panel: tocar un paso lo muestra en el mapa
  const enfocar = id => {
    const f = focos[id];
    document.querySelectorAll('.panel-mapa [data-foco]').forEach(li => li.classList.toggle('activo', li.dataset.foco === id));
    const li = document.querySelector(`.panel-mapa [data-foco="${id}"]`);
    li?.scrollIntoView({ block: 'nearest', behavior: suave ? 'smooth' : 'auto' });
    if (!f) { toast('Este paso todavía no tiene ubicación en el mapa.'); return false; }
    if (f.limites) suave ? mapa.flyToBounds(f.limites, { padding: [60, 60], duration: 1.4 }) : mapa.fitBounds(f.limites, { padding: [60, 60] });
    else suave ? mapa.flyTo(f.centro, f.zoom, { duration: 1.4 }) : mapa.setView(f.centro, f.zoom);
    mapa.once('moveend', () => f.capa?.openPopup());
    return true;
  };
  document.querySelectorAll('.panel-mapa [data-foco]').forEach(li => li.addEventListener('click', ev => {
    if (ev.target.closest('a,[data-destino]')) return;
    detenerRepro(); enfocar(li.dataset.foco);
    if (window.innerWidth <= 1000) el.scrollIntoView({ behavior: suave ? 'smooth' : 'auto' });
  }));

  const btn = $('#reproducir');
  if (btn) btn.onclick = () => {
    if (reproTimer) { detenerRepro(); return; }
    const pasos = [...document.querySelectorAll('.panel-mapa [data-foco]')].map(li => li.dataset.foco).filter(id => focos[id]);
    if (!pasos.length) { toast('Agreguen ubicaciones para poder recorrer el viaje.'); return; }
    btn.textContent = '⏸ Detener';
    if (window.innerWidth <= 1000) el.scrollIntoView({ behavior: suave ? 'smooth' : 'auto' });
    let i = 0;
    const paso = () => {
      if (i >= pasos.length) { detenerRepro(); mapa.closePopup(); verTodo(); return; }
      enfocar(pasos[i++]);
      reproTimer = setTimeout(paso, 3200);
    };
    mapa.closePopup(); verTodo();
    reproTimer = setTimeout(paso, 1200);
  };
}

  const vistas = { hoy: vHoy, calendario: vCalendario, destino: vDestino, resumen: vResumen, recorrido: vRecorrido, alojamientos: vAlojamientos, conexiones: vConexiones, mapa: vMapa, ideas: vIdeas, gastos: vGastos, checklist: vChecklist, ajustes: vAjustes };

function campoHTML(c, v) {
  const id = 'f_' + c.k;
  const val = v !== undefined && v !== null ? v : (c.def ? c.def() : '');
  if (c.t === 'geo') {
    const g = v || {};
    return `<div class="campo ancho"><span>${esc(c.l)}</span>
      <div class="geo"><input id="${id}" name="${c.k}_q" value="${esc(g.q || '')}" placeholder="Se completa solo al guardar, o búscalo aquí" aria-label="${esc(c.l)}">
      <button type="button" class="btn sec chico" data-buscar-geo="${c.k}">Buscar</button></div>
      <input type="hidden" name="${c.k}_lat" value="${g.lat ?? ''}"><input type="hidden" name="${c.k}_lng" value="${g.lng ?? ''}"><input type="hidden" name="${c.k}_nom" value="${esc(g.nombre || '')}"><input type="hidden" name="${c.k}_tz" value="${esc(g.tz || '')}">
      <p class="geo-res" data-geo-res="${c.k}">${g.lat ? '📍 ' + esc(g.nombre || 'Ubicación guardada') : 'Sin ubicación todavía.'}</p></div>`;
  }
  let input;
  if (c.t === 'textarea') input = `<textarea id="${id}" name="${c.k}" rows="3" placeholder="${esc(c.ph || '')}">${esc(val)}</textarea>`;
  else if (c.t === 'select') {
    const ops = typeof c.op === 'function' ? c.op() : c.op;
    const pares = ops.map(o => Array.isArray(o) ? o : [o, o]);
    if (val && !pares.some(([v]) => v === val)) pares.push([val, val]);
    input = `<select id="${id}" name="${c.k}">${pares.map(([v, t]) => `<option value="${esc(v)}" ${v === val ? 'selected' : ''}>${esc(t || '—')}</option>`).join('')}</select>`;
  } else {
    input = `<input id="${id}" name="${c.k}" type="${c.t || 'text'}" value="${esc(val)}" placeholder="${esc(c.ph || '')}" ${c.t === 'number' ? 'step="any" inputmode="decimal"' : ''} ${c.req ? 'required' : ''} ${c.t === 'date' && !c.libre ? `min="${FECHA_MIN}" max="${FECHA_MAX}"` : ''} ${c.t === 'datetime-local' ? `min="${FECHA_MIN}T00:00" max="${FECHA_MAX}T23:59"` : ''} ${c.lista ? `list="dl_${c.k}" autocomplete="off"` : ''}>`;
    if (c.lista) input += `<datalist id="dl_${c.k}">${[...new Set(etapasOrd().map(e => e.datos.ciudad).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  }
  return `<label class="campo ${c.ancho ? 'ancho' : ''}" for="${id}"><span>${esc(c.l)}</span>${input}</label>`;
}

function leerForm(form, tipo) {
  const f = new FormData(form), out = {};
  for (const c of TIPOS[tipo].campos) {
    if (c.t === 'geo') {
      const lat = parseFloat(f.get(c.k + '_lat')), lng = parseFloat(f.get(c.k + '_lng'));
      out[c.k] = { q: (f.get(c.k + '_q') || '').trim(), lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng, nombre: f.get(c.k + '_nom') || '', tz: f.get(c.k + '_tz') || '' };
    } else if (c.t === 'number') { const v = f.get(c.k); out[c.k] = v === '' || v == null ? '' : Number(v); }
    else out[c.k] = (f.get(c.k) || '').trim();
  }
  if (out.moneda) out.moneda = out.moneda.toUpperCase();
  return out;
}

function prepararForm(form, tipo, item) {
  // buscar ubicación manualmente
  form.querySelectorAll('[data-buscar-geo]').forEach(b => b.addEventListener('click', async () => {
    const k = b.dataset.buscarGeo, campo = TIPOS[tipo].campos.find(c => c.k === k);
    const q = form[k + '_q'].value.trim() || campo.auto?.(leerForm(form, tipo)) || '';
    const res = form.querySelector(`[data-geo-res="${k}"]`);
    res.textContent = 'Buscando…';
    const g = await geocodificar(q);
    if (g) { form[k + '_lat'].value = g.lat; form[k + '_lng'].value = g.lng; form[k + '_nom'].value = g.nombre; form[k + '_tz'].value = g.tz || ''; res.textContent = '📍 ' + g.nombre; }
    else res.textContent = 'No se encontró. Prueba agregando la ciudad o el país.';
  }));
  // si cambian el texto, la ubicación anterior deja de valer
  form.querySelectorAll('input[name$="_q"]').forEach(inp => inp.addEventListener('input', () => {
    const k = inp.name.slice(0, -2);
    form[k + '_lat'].value = ''; form[k + '_lng'].value = ''; form[k + '_nom'].value = ''; form[k + '_tz'].value = '';
    form.querySelector(`[data-geo-res="${k}"]`).textContent = 'Se buscará al guardar.';
  }));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = form.querySelector('button:not([type])') || form.querySelector('[type=submit]');
    const datos = leerForm(form, tipo);
    // conservar campos que no están en el formulario (votos, hecho, visitado)
    const final = Object.assign({}, item?.datos || {}, datos);
    if (tipo === 'etapa' && final.llegada && final.salida && final.salida < final.llegada) { toast('La salida no puede ser antes de la llegada.', true); return; }
    if (tipo === 'alojamiento' && final.entrada && final.salida && final.salida < final.entrada) { toast('El check-out no puede ser antes del check-in.', true); return; }
    if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }
    // ubicar automáticamente en el mapa si falta
    for (const c of TIPOS[tipo].campos.filter(c => c.t === 'geo')) {
      const g = final[c.k];
      if (!g.lat) {
        const q = g.q || c.auto?.(final);
        const r = q ? await geocodificar(q) : null;
        if (r) final[c.k] = { q: g.q, ...r };
      }
    }
    if (tipo === 'conexion') {
      for (const [campo, geo] of [['desde', 'geoDesde'], ['hasta', 'geoHasta']]) {
        if (final[geo]?.q !== final[campo] || !final[geo]?.lat) final[geo] = await ubicarCiudad(final[campo]);
      }
    }
    const ok = await guardar(tipo, final, item?.id);
    if (ok) { if (form.closest('dialog')) $('#dlg').close(); toast(item ? 'Cambios guardados' : 'Agregado'); }
    else if (btn) { btn.disabled = false; btn.textContent = item ? 'Guardar cambios' : 'Agregar'; }
  });
}

function abrirForm(tipo, item, previo) {
  const T = TIPOS[tipo], d = item?.datos || previo || {};
  const dlg = $('#dlg');
  dlg.innerHTML = `<form class="form">
    <h2>${item ? 'Editar' : 'Agregar'} ${T.singular}</h2>
    <div class="campos">${T.campos.map(c => campoHTML(c, d[c.k])).join('')}</div>
    ${item?.autor ? `<p class="autor">Agregado por ${esc(item.autor)}</p>` : ''}
    <div class="acciones">${item ? '<button type="button" class="btn peligro" data-borrar>Eliminar</button>' : ''}<span class="sep"></span>
      <button type="button" class="btn sec" data-cerrar>Cancelar</button><button class="btn pri">${item ? 'Guardar cambios' : 'Agregar'}</button></div></form>`;
  const form = dlg.querySelector('form');
  prepararForm(form, tipo, item);
  dlg.querySelector('[data-cerrar]').onclick = () => dlg.close();
  const b = dlg.querySelector('[data-borrar]');
  if (b) b.onclick = async () => {
    if (!confirm('¿Eliminar este elemento? Se borra para los dos.')) return;
    if (await borrar(item.id)) { dlg.close(); toast('Eliminado'); }
  };
  dlg.showModal();
}

document.addEventListener('click', async ev => {
  if (ev.target.closest('a')) return;
  const t = ev.target.closest('[data-dia],[data-hoy-dia],[data-dia-mapa],[data-abrir-dia],[data-ir],[data-destino],[data-nuevo],[data-voto],[data-alternar],[data-sugeridas],[data-cambiar-yo],[data-respaldo],[data-salir],[data-editar]');
  if (!t || t.closest('dialog')) return;
  const ds = t.dataset;
  if (ds.dia) { st.diaCal = ds.dia; render(); if (window.innerWidth <= 1000) $('.dia-detalle')?.scrollIntoView({ behavior: 'smooth' }); }
  else if (ds.hoyDia !== undefined) { if (ds.hoyDia) { st.diaHoy = ds.hoyDia; render(); } }
  else if (ds.abrirDia) { st.diaCal = ds.abrirDia; st.vista = 'calendario'; render(); window.scrollTo(0, 0); }
  else if (ds.diaMapa !== undefined) {
    st.diaMapa = ds.diaMapa;
    document.querySelectorAll('.chips-dia [data-dia-mapa]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.diaMapa === st.diaMapa)));
    const ley = $('#leyendaMapaDestino'); if (ley) ley.textContent = st.diaMapa ? 'La línea muestra el orden del día, partiendo desde el alojamiento.' : '🛏️ Alojamiento y panoramas. Elijan un día para ver su recorrido.';
    if (mapa) { mapa.remove(); mapa = null; }
    dibujarMapaDestino();
    if (window.innerWidth <= 1000) $('#mapaDestino')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (ds.destino) { if (st.destino !== ds.destino) st.diaMapa = ''; st.destino = ds.destino; st.vista = 'destino'; st.mapaVista = null; render(); window.scrollTo(0, 0); }
  else if (ds.ir) { if (st.vista !== ds.ir) st.mapaVista = null; st.vista = ds.ir; render(); window.scrollTo(0, 0); }
  else if (ds.nuevo) { let p = null; try { p = ds.pre ? JSON.parse(ds.pre) : null; } catch {} abrirForm(ds.nuevo, null, p); }
  else if (ds.voto) {
    const it = porId(ds.voto); if (!it) return;
    if (!st.yo) return toast('Primero dinos quién eres en Ajustes.', true);
    const votos = new Set(it.datos.votos || []);
    votos.has(st.yo) ? votos.delete(st.yo) : votos.add(st.yo);
    await guardar(it.tipo, { ...it.datos, votos: [...votos] }, it.id);
  }
  else if (ds.alternar) {
    const it = porId(ds.alternar); if (!it) return;
    t.disabled = true;
    await guardar(it.tipo, { ...it.datos, [ds.campo]: !it.datos[ds.campo] }, it.id);
  }
  else if (t.hasAttribute('data-sugeridas')) await guardarVarios(SUGERIDAS.map(([texto, categoria]) => ({ tipo: 'tarea', datos: { texto, categoria, responsable: 'Ambos', hecho: false } })));
  else if (t.hasAttribute('data-cambiar-yo')) pantallaQuienSoy();
  else if (t.hasAttribute('data-respaldo')) {
    const blob = new Blob([JSON.stringify(st.items, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `viaje-respaldo-${iso(new Date())}.json`; a.click();
  }
  else if (t.hasAttribute('data-salir')) {
    if (!confirm('Vas a tener que escribir la clave del viaje otra vez en este dispositivo. ¿Continuar?')) return;
    guardarLocal('viaje-clave', null); location.reload();
  }
  else if (ds.editar) { const it = porId(ds.editar); if (it) abrirForm(it.tipo, it); }
});
document.addEventListener('change', async ev => {

});

async function iniciar() {

}

(async function arrancar() {
  if (!window.supabase || !window.L) { $('#raiz').innerHTML = `<div class="entrada"><div class="caja"><h1>Sin conexión</h1><p>No se pudieron cargar las librerías. Revisa tu internet y recarga la página.</p></div></div>`; return; }
  if (!configurado) return pantallaSinConfigurar();
  const guardada = leerLocal('viaje-clave');
  if (!guardada) return pantallaClave();
  try {
    const c = await probarClave(guardada);
    if (!c) { guardarLocal('viaje-clave', null); return pantallaClave('La clave del viaje cambió. Escribe la nueva.'); }
    sb = c; iniciar();
  } catch (e) { pantallaClave('No se pudo conectar con Supabase: ' + (e.message || e)); }
})();
